# Builds BusyBox for QNX with qnx/build.sh in the toolchain's container
# image: one file for QNX 6.5 on x86 and one for BlackBerry 10. Every push
# and pull request keeps both as build results; a tag v* publishes them as a
# release with their checksums.
#
# The builds are reproducible: the same commit and the same image give the
# same files (qnx/README.md), so a release carries the same bytes as the
# build of its commit.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ghcr.io/xiazy/blackberry10-toolchain, pinned by digest (the multi-arch tag).
  IMAGE: ghcr.io/xiazy/blackberry10-toolchain@sha256:60ce49510a37ed92368cca010bbaabf97b12d209b9fab179e8491b266bb2578f

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # What each file must be: its processor as readelf names it, and
          # the libraries it may need, which are its system's own.
          - target: qnx65
            name: qnx65-x86
            machine: Intel 80386
            needed: "libc.so.3 libm.so.2 libsocket.so.3 "
          - target: bb10
            name: bb10-armle-v7
            machine: ARM
            needed: "libbps.so.3 libc.so.3 libm.so.2 libsocket.so.3 "
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            "$IMAGE" qnx/build.sh ${{ matrix.target }}
      - name: Check that it is a 32-bit QNX program for its processor
        env:
          MACHINE: ${{ matrix.machine }}
          NEEDED: ${{ matrix.needed }}
        run: |
          file busybox
          readelf -h busybox | grep -q 'Class: *ELF32'
          readelf -h busybox | grep -q "Machine: *$MACHINE\$"
          readelf -l busybox | grep -q 'interpreter: /usr/lib/ldqnx.so.2'
          # Linked against its system's own libraries and nothing else.
          needed=$(readelf -d busybox | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
          echo "needs: $needed"
          [ "$needed" = "$NEEDED" ]
      - name: Name the file and write its checksum
        run: |
          version=$(sed -n 's/^VERSION = //p; s/^PATCHLEVEL = //p; s/^SUBLEVEL = //p' Makefile | paste -sd.)
          name=busybox-$version-${{ matrix.name }}
          mkdir out
          cp busybox "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: busybox-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: busybox-*
          path: out
          merge-multiple: true
      - name: Notes
        run: |
          {
            echo "BusyBox for QNX 6.5 (x86) and BlackBerry 10 (QNX 8, 32-bit ARM): one program for each, built from the same source and linked against the system's own libraries. Built from this tag by the build workflow; \`qnx/README.md\` says how to build them again and get the same files."
            echo
            echo '```'
            cat out/*.sha256
            echo '```'
            echo
            # The document's lists: the tools that are in, and those that are out.
            sed -n '/^## The tools that are in/,/^## What differs/p' qnx/README.md | sed '$d'
          } > notes.md
          cat notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md
